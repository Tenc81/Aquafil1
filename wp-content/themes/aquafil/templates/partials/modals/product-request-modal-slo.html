<div class="side-modal" product-request-slo="product-request-slo" id="product-request-slo">
  <div class="card--side-modal">
    <div class="card--side-modal__content">
      <div *if="!success">
        <div class="card--side-modal__title" [innerhtml]="productName"></div>
        <form class="form" [formgroup]="form" (submit)="onSubmit($event)" name="form" role="form" novalidate="novalidate" autocomplete="off">
          <!-- send product title directly to CF7 field name 'your-product' -->
          <input type="hidden" name="your-product" [formcontrol]="controls.titolo_prodotto" />
          <div class="row">
            <div class="col-sm-11">
              <input name="checkField" [formcontrol]="controls.checkField" value="" type="text" style="display:none !important;"/>
              <div control-text="control-text" [control]="controls.firstName" label="Ime"></div>
            </div>
            <div class="col-sm-11 offset-sm-2">
              <div control-text="control-text" [control]="controls.lastName" label="Priimek"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-11">
              <div control-text="control-text" [control]="controls.email" label="E-pošta"></div>
            </div>
            <div class="col-sm-11 offset-sm-2">
              <div control-text="control-text" [control]="controls.address" label="Naslov"></div>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-11">
              <div control-text="control-text" [control]="controls.city" label="Mesto"></div>
            </div>
            <div class="col-sm-11 offset-sm-2">
              <div control-text="control-text" [control]="controls.zip" label="Poštna številka"></div>
            </div>
          </div>
          <div control-textarea="control-textarea" [control]="controls.message" label="Sporočilo"></div>
          <div class="row">
            <div class="col-sm-24">
              <div control-file="control-file" [control]="controls.file" label="Dodaj življenjepis"></div>
            </div>
          </div>
          <test-component [form]="form" (test)="test($event)" (reset)="reset($event)"></test-component>
          <div class="full" control-checkbox="control-checkbox" [control]="controls.privacy" label="S prijavo na delovno mesto podajam nedvoumno privolitev za obdelavo mojih osebnih podatkov s strani podjetja AquafilSLO d.o.o. (Letališka cesta 15, 1000 Ljubljana), v skladu z veljavno zakonodajo (Splošna uredba o varstvu podatkov - GDPR.). Dovoljujem zbiranje, shranjevanje, obdelavo in uporabo vseh podatkov, navedenih v moji prijavi za namen postopka izbire in zaposlitve. Podatki ne bodo posredovani tretjim osebam brez mojega soglasja, razen če to zahteva zakon. Strinjam se s <a href='https://www.aquafil.com/assets/uploads/Politika-zasebnosti-AquafilSLO.pdf' target='_blank' style='display:inline !important;'>Pogoji zasebnosti pri oddaji prijave za zaposlitev družbe AquafilSLO d.o.o.</a> Zavedam se svojih pravic glede dostopa, popravka, izbrisa, omejitve obdelave in ugovora. Privolitev ne vpliva na zakonitost obdelave in jo lahko kadarkoli prekličem."></div>
          <div class="form__error" *if="error">
            <span class="status-code" [innerhtml]="error.statusCode"></span>
            <span class="status-message" [innerhtml]="error.statusMessage"></span>
            <span class="friendly-message" [innerhtml]="error.friendlyMessage"></span>
          </div>
          <button type="submit" class="btn--submit" data-title="Pošlji" *if="!form.submitted">
            <span>Pošlji</span>
          </button>
          <button type="submit" class="btn--submit is-sending" data-title="Pošiljanje..." *if="form.submitted">
            <span>Pošiljanje...</span>
          </button>
        </form>
      </div>
      <div *if="success">
        <div class="card--side-modal__title">Zahteva poslana</div>
        <div class="card--side-modal__text">
          <p>Hvala za kontakt. Vaša zahteva je bila uspešno poslana.</p>
        </div>
      </div>
      <button type="button" class="btn--close" (click)="onClose()">
        <svg width="24" height="24" viewbox="0 0 24 24">
          <use xlink:href="#close"></use>
        </svg>
      </button>
    </div>
  </div>
</div>

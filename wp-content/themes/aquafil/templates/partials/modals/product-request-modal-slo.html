<div careers-modal [countryId]="<!--@@var=countryId-->">
	<div *if="!success">
		<!--
		<div class="contact-modal__head">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-22 offset-sm-1">
						<div class="contact-modal__title">Richiesta Di Contatto</div>
					</div>
				</div>
			</div>
		</div>-->
		<form class="form" [formGroup]="form" (submit)="onSubmit($event)" name="form" role="form" novalidate autocomplete="off">
			<div class="contact-modal__content">
				<div class="container-fluid">
					<div class="row">
						<div class="col-sm-22 offset-sm-1">
							<p class="contact-modal__text-top">
								Izpolnite spodnji obrazec
							</p>
						</div>
					</div>
					<div class="row">
						<div class="col-sm-10 offset-sm-1">
							<input name="checkField" [formControl]="controls.checkField" value="" type="text" style="display:none !important;" />
							<div control-text [control]="controls.firstName" label="Ime"></div>
						</div>
						<div class="col-sm-10 offset-sm-1">
							<div control-text [control]="controls.lastName" label="Priimek"></div>
						</div>
						<div class="col-sm-10 offset-sm-1">
							<div control-text [control]="controls.email" label="E-pošta"></div>
						</div>
						<div class="col-sm-10 offset-sm-1">
							<div control-text [control]="controls.address" label="Naslov"></div>
						</div>
						<div class="col-sm-10 offset-sm-1">
							<div control-text [control]="controls.city" label="Mesto"></div>
						</div>
						<div class="col-sm-10 offset-sm-1">
							<div control-text [control]="controls.zip" label="Poštna števlika"></div>
						</div>
						<div class="col-sm-21 offset-sm-1">
							<div control-file [control]="controls.file" label="Dodaj življenjepis"></div>
						</div>
					</div>

					<div class="row">
						<div class="col-sm-22 offset-sm-1">
							<test-component [form]="form" (test)="test($event)" (reset)="reset($event)"></test-component>
							<div class="full" control-checkbox [control]="controls.privacy" label="S prijavo na razpis za delovno mesto v podjetju AquafilSLO d.o.o."></div>
							<div class="form__error" *if="error">
								<span class="status-code" [innerHTML]="error.statusCode"></span>
								<span class="status-message" [innerHTML]="error.statusMessage"></span>
								<span class="friendly-message" [innerHTML]="error.friendlyMessage"></span>
							</div>
						</div>
					</div>

					<div class="row">
						<div class="col-sm-22 offset-sm-1">
							<button type="submit" class="btn--submit" data-title="Pošlji" *if="!form.submitted">
								<span>Pošlji</span>
							</button>
							<button type="submit" class="btn--submit" data-title="Odposlanec" *if="form.submitted">
								<span>Odposlanec</span>
							</button>
						</div>
					</div>
				</div>
			</div>
			<!--
			<div class="contact-modal__foot">
				<button type="submit" class="btn--submit" data-title="Invia" *if="!form.submitted">
					<span>Invia</span>
				</button>
				<button type="submit" class="btn--submit" data-title="Inviato!" *if="form.submitted">
					<span>Inviato!</span>
				</button>
			</div>-->
		</form>
	</div>
	<div class="container-fluid" *if="success">
		<div class="row">
			<div class="col-sm-22 offset-sm-1">
				<div class="contact-modal__head">
					<div class="contact-modal__title">Richiesta Inviata</div>
				</div>
				<div class="contact-modal__content">
					<div class="contact-modal__abstract">Grazie per averci contattato. La tua richiesta è stata inviata correttamente.</div>
				</div>
			</div>
		</div>
	</div>
	<button type="button" class="btn--close" (click)="onClose()"><svg width="24" height="24" viewBox="0 0 24 24"><use xlink:href="#close"></use></svg></button>
</div>
